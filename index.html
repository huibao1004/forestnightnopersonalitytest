<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026臺大森林之夜——在森林之中，屬於你的代表物是？</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-bg: #E5E9EC; /* 礦石灰藍背景 */
            --text-color: #2C3E2D;
            --accent-color: #6B8E73;
            --button-hover: #000385a;
            --card-bg: #FFFFFF;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            min-height: 100vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* 區塊共用設定 */
        .section {
            display: none;
            padding: 40px 30px;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            animation: fadeIn 0.5s ease-in-out;
        }

        .section.active {
            display: flex;
        }

        h1, h2, h3 {
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-color);
            line-height: 1.4;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin-bottom: 20px;
            object-fit: cover;
        }

        /* 按鈕設計 - 簡約風 */
        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 300px;
            margin-bottom: 15px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .btn:hover {
            background-color: var(--button-hover);
            transform: translateY(-2px);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }

        .btn-outline:hover {
            background-color: var(--primary-bg);
        }

        /* 測驗進度與選項 */
        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #E0E0E0;
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-top: 20px;
        }

        .option-btn {
            background-color: var(--primary-bg);
            border: 1px solid transparent;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-color);
        }

        .option-btn:hover {
            background-color: #E8EFE9;
            border-color: var(--accent-color);
        }

        /* 結果頁面設計 (已改為純圖無文字) */
        #result-content {
            background-color: transparent;
            padding: 0;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        #result-img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 首頁 -->
    <div id="home-section" class="section active" style="padding: 0;">
        <div style="width: 100%; height: 300px; overflow: hidden; position: relative;">
            <img src="biotopia.jpg" alt="Biotopia Cover" style="width: 100%; height: 100%; object-fit: cover; margin: 0;">
        </div>
        
        <div style="padding: 40px 30px;">
            <h1 style="font-size: 28px; letter-spacing: 2px;">在森林之中，<br>屬於你的代表物是？</h1>
            
            <p style="font-size: 14px; color: #888; margin-bottom: 10px; font-style: italic;">
                This is a fun personality test designed for <br>NTU Forestry Night.<br>
                Based on the Big Five personality traits,<br>
                each character represents a unique personality type.
            </p>
            
            <p style="margin-top: 20px;">跟隨直覺，尋找屬於你的森林定位。</p>
            
            <button class="btn" onclick="startTest()" style="margin-top: 20px;">開啟森林旅程</button>
            
            <div style="margin-top: 30px; opacity: 0.8;">
                <p style="font-size: 12px; color: #888; margin-bottom: 5px; letter-spacing: 1px;">累計探索人次</p>
                <img src="https://hits.sh/huibao1004.github.io/forestnightnopersonalitytest.svg?style=for-the-badge&label=VIEWS&color=6B8E73" alt="網站瀏覽次數">
            </div>
        </div>
    </div>

    <!-- 測驗頁 -->
    <div id="quiz-section" class="section">
        <div class="progress-bar"><div class="progress" id="progress"></div></div>
        <p id="question-counter" style="font-size: 14px; margin-bottom: 10px; color: #888;">1 / 15</p>
        <h3 id="question-text" style="min-height: 80px; display: flex; align-items: center; justify-content: center;">問題載入中...</h3>
        
        <div class="options-container">
            <button class="option-btn" onclick="selectAnswer(5)">非常同意</button>
            <button class="option-btn" onclick="selectAnswer(4)">同意</button>
            <button class="option-btn" onclick="selectAnswer(3)">普通</button>
            <button class="option-btn" onclick="selectAnswer(2)">不同意</button>
            <button class="option-btn" onclick="selectAnswer(1)">非常不同意</button>
        </div>
    </div>

    <!-- 結果頁 -->
    <div id="result-section" class="section">
        <div id="result-content">
            <!-- 這裡只負責顯示你上傳的精美大圖 -->
            <img id="result-img" src="" alt="測驗結果">
        </div>
        
        <button id="download-btn" class="btn" onclick="downloadResult()">長按圖片儲存 / 點此下載</button>
        <button id="share-btn" class="btn btn-outline" onclick="shareResult()">分享測驗給朋友</button>
        
        <!-- 彩蛋按鈕 -->
        <button id="rickroll-btn" class="btn" style="display: none; background-color: #D96A6A; color: white; margin-top: 10px;" onclick="window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ', '_blank')">🎁 領取隱藏版大禮包</button>

        <button class="btn btn-outline" style="border: none; color: #888; font-size: 14px; margin-top: 10px;" onclick="location.reload()">重新測驗</button>
    </div>
</div>

<script>
    // 題庫
    const questions = [
        { text: "在社交場合中，<br>我是負責帶動氣氛的小動物。", trait: "E", reverse: false },
        { text: "在社交場合中面對陌生面孔，<br>我會主動打招呼。", trait: "E", reverse: false },
        { text: "比起參與小動物們的聚會，<br>我更傾向獨自待著。", trait: "E", reverse: true },
        { text: "當朋友受傷或難過時，<br>我會主動上前關心。", trait: "A", reverse: false },
        { text: "我傾向於相信森林裡的每隻動物，<br>並樂於分享資源給大家。", trait: "A", reverse: false },
        { text: "遇到衝突時，我會表現強勢的一面，<br>甚至直接指出別人的錯誤。", trait: "A", reverse: true },
        { text: "我會傾向於事先規劃日常進度，<br>並確保自己在生活軌道上。", trait: "C", reverse: false },
        { text: "只要是已經約定好的安排與規劃，<br>我就會做到。", trait: "C", reverse: false },
        { text: "我傾向隨遇而安，<br>彈性規劃我的日常進度。", trait: "C", reverse: true },
        { text: "當我遇到不如預期的挫折時，<br>我無法像老樹一樣找回內心平靜。", trait: "S", reverse: false },
        { text: "我容易感到壓力，<br>即使這是能克服的小挫折。", trait: "S", reverse: false },
        { text: "即使周遭的動物們都在焦慮，<br>我能保持客觀，不被情緒左右。", trait: "S", reverse: true },
        { text: "我對於森林裡的抽象與奧秘充滿興趣。", trait: "O", reverse: false },
        { text: "我喜歡收集特別的小物，<br>比起實用性，我更在意美感與深度。", trait: "O", reverse: false },
        { text: "我傾向實際、穩定的生活方式，<br>對抽象事物沒興趣。", trait: "O", reverse: true }
    ];

    // 五大結果圖片對應表 (請確認圖片檔名跟你上傳到 GitHub 的一樣)
    const resultsData = {
        "E": { img: "magpie_result.jpg" }, // 臺灣藍鵲
        "A": { img: "deer_result.jpg" },   // 臺灣水鹿
        "C": { img: "bear_result.jpg" },   // 臺灣黑熊
        "S": { img: "muntjac_result.jpg" },// 臺灣山羌
        "O": { img: "mineral_result.jpg" } // 礦物與土壤
    };

    let currentIndex = 0;
    let scores = { "E": 0, "A": 0, "C": 0, "S": 0, "O": 0 };
    let rawAnswers = [];

    function startTest() {
        document.getElementById('home-section').classList.remove('active');
        document.getElementById('quiz-section').classList.add('active');
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentIndex];
        document.getElementById('question-text').innerHTML = q.text;
        document.getElementById('question-counter').innerText = `${currentIndex + 1} / ${questions.length}`;
        const progressPercent = ((currentIndex) / questions.length) * 100;
        document.getElementById('progress').style.width = `${progressPercent}%`;
    }

    function selectAnswer(score) {
        const q = questions[currentIndex];
        let finalScore = q.reverse ? (6 - score) : score;
        scores[q.trait] += finalScore;

        rawAnswers.push(score);

        currentIndex++;
        if (currentIndex < questions.length) {
            showQuestion();
        } else {
            calculateResult();
        }
    }

    function calculateResult() {
        // 檢查是否15題全部選了一模一樣的選項
        const allSame = rawAnswers.every(val => val === rawAnswers[0]);

        if (allSame && rawAnswers.length === questions.length) {
            // 【觸發彩蛋】：隱藏結果圖與常規按鈕
            document.getElementById('result-content').style.display = "none";
            document.getElementById('download-btn').style.display = "none";
            document.getElementById('share-btn').style.display = "none";
            
            // 顯示大禮包按鈕
            document.getElementById('rickroll-btn').style.display = "block";
            alert("⚠️ 系統偵測到異常的執念... 隱藏機關已觸發hahaha！");
            
        } else {
            // 【常規模式】：確保彩蛋按鈕隱藏，顯示結果圖與常規按鈕
            document.getElementById('result-content').style.display = "block";
            document.getElementById('download-btn').style.display = "block";
            document.getElementById('share-btn').style.display = "block";
            document.getElementById('rickroll-btn').style.display = "none";

            // 常規計算邏輯：找出最高分
            let highestTrait = "E";
            let maxScore = 0;
            
            for (const [trait, score] of Object.entries(scores)) {
                if (score > maxScore) {
                    maxScore = score;
                    highestTrait = trait;
                }
            }

            // 直接將大圖指定給 img 標籤
            document.getElementById('result-img').src = resultsData[highestTrait].img;
        }

        // 切換到結果頁面
        document.getElementById('quiz-section').classList.remove('active');
        document.getElementById('result-section').classList.add('active');
    }

    function downloadResult() {
        const resultContent = document.getElementById('result-content');

        html2canvas(resultContent, {
            scale: 2,
            backgroundColor: "transparent",
            useCORS: true,
            scrollY: -window.scrollY
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = '我的森林代表物.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    function shareResult() {
        if (navigator.share) {
            navigator.share({
                title: '2026臺大森林之夜',
                text: '我剛完成了這個療癒的心理測驗yaaaahooooo，快來測測看你是哪種森林代表物！',
                url: window.location.href
            }).catch(console.error);
        } else {
            alert('複製網址分享給朋友吧：\n' + window.location.href);
        }
    }
</script>

</body>
</html>
